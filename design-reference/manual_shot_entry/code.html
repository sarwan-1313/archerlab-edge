<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Manual Shot Entry - ArcherLab Edge</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-primary-container": "#00626e",
                    "primary-container": "#00e5ff",
                    "background": "#0b1326",
                    "surface-bright": "#31394d",
                    "outline-variant": "#3b494c",
                    "inverse-surface": "#dae2fd",
                    "primary-fixed": "#9cf0ff",
                    "inverse-on-surface": "#283044",
                    "on-tertiary-fixed": "#111c2d",
                    "secondary-fixed": "#d3e4fe",
                    "surface-tint": "#00daf3",
                    "primary": "#c3f5ff",
                    "surface-variant": "#2d3449",
                    "on-surface-variant": "#bac9cc",
                    "on-error": "#690005",
                    "inverse-primary": "#006875",
                    "outline": "#849396",
                    "tertiary": "#e6edff",
                    "on-surface": "#dae2fd",
                    "on-tertiary-fixed-variant": "#3c475a",
                    "surface-dim": "#0b1326",
                    "secondary": "#b7c8e1",
                    "on-tertiary": "#263143",
                    "surface-container": "#171f33",
                    "tertiary-fixed": "#d8e3fb",
                    "tertiary-container": "#c6d1e9",
                    "on-secondary-fixed": "#0b1c30",
                    "surface-container-low": "#131b2e",
                    "on-secondary": "#213145",
                    "on-primary-fixed-variant": "#004f58",
                    "on-secondary-fixed-variant": "#38485d",
                    "surface-container-high": "#222a3d",
                    "error": "#ffb4ab",
                    "secondary-fixed-dim": "#b7c8e1",
                    "on-background": "#dae2fd",
                    "on-primary-fixed": "#001f24",
                    "tertiary-fixed-dim": "#bcc7de",
                    "on-tertiary-container": "#4f5a6e",
                    "error-container": "#93000a",
                    "secondary-container": "#3a4a5f",
                    "on-primary": "#00363d",
                    "surface": "#0b1326",
                    "on-error-container": "#ffdad6",
                    "surface-container-lowest": "#060e20",
                    "primary-fixed-dim": "#00daf3",
                    "on-secondary-container": "#a9bad3",
                    "surface-container-highest": "#2d3449"
            },
            "borderRadius": {
                    "DEFAULT": "0.125rem",
                    "lg": "0.25rem",
                    "xl": "0.5rem",
                    "full": "0.75rem"
            },
            "spacing": {
                    "unit": "4px",
                    "gutter": "16px",
                    "container-padding": "24px",
                    "section-gap": "48px",
                    "stack-sm": "8px",
                    "stack-md": "16px"
            },
            "fontFamily": {
                    "headline-md": ["Hanken Grotesk"],
                    "display-lg": ["Hanken Grotesk"],
                    "data-mono": ["JetBrains Mono"],
                    "label-caps": ["JetBrains Mono"],
                    "headline-md-mobile": ["Hanken Grotesk"],
                    "body-md": ["Inter"],
                    "body-lg": ["Inter"],
                    "headline-sm": ["Hanken Grotesk"]
            },
            "fontSize": {
                    "headline-md": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "data-mono": ["14px", {"lineHeight": "20px", "fontWeight": "500"}],
                    "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "700"}],
                    "headline-md-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-sm": ["24px", {"lineHeight": "32px", "fontWeight": "600"}]
            }
          },
        }
      }
    </script>
<style>
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
        .filled-icon { font-variation-settings: 'FILL' 1; }
        
        /* Custom Target CSS */
        .archery-target {
            background: 
                radial-gradient(circle, #facc15 0%, #facc15 20%, transparent 20.5%),
                radial-gradient(circle, #ef4444 0%, #ef4444 40%, transparent 40.5%),
                radial-gradient(circle, #3b82f6 0%, #3b82f6 60%, transparent 60.5%),
                radial-gradient(circle, #1f2937 0%, #1f2937 80%, transparent 80.5%),
                radial-gradient(circle, #f9fafb 0%, #f9fafb 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .target-ring {
            border: 1px solid rgba(0,0,0,0.2);
            border-radius: 50%;
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body class="bg-background text-on-surface min-h-screen antialiased flex flex-col">
<!-- TopAppBar (Suppressed navigation, replacing with functional header for transactional screen) -->
<header class="bg-surface-dim/80 backdrop-blur-md fixed top-0 w-full z-50 border-b border-white/10 flex justify-between items-center px-gutter h-16">
<button class="text-on-surface-variant hover:text-primary transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
<span class="font-label-caps text-label-caps">Cancel</span>
</button>
<div class="font-headline-sm text-headline-sm-mobile md:text-headline-sm text-primary-fixed-dim tracking-tight">Manual Entry</div>
<div class="w-16"></div> <!-- Spacer for balance -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 pb-32 px-gutter md:px-container-padding flex flex-col items-center max-w-3xl mx-auto w-full pt-stack-md gap-stack-md">
<!-- Target Section -->
<section class="w-full bg-surface-container-high rounded-xl border border-white/5 p-container-padding flex flex-col items-center relative overflow-hidden">
<div class="w-full flex justify-between items-center mb-stack-md z-10">
<h2 class="font-label-caps text-label-caps text-on-surface-variant">Tap target to place arrow</h2>
<div class="flex gap-2">
<button class="text-on-surface-variant hover:text-primary transition-colors p-1" title="Undo">
<span class="material-symbols-outlined text-xl">undo</span>
</button>
<button class="text-on-surface-variant hover:text-primary transition-colors p-1" title="Clear">
<span class="material-symbols-outlined text-xl">delete</span>
</button>
</div>
</div>
<!-- Interactive Target Area -->
<div class="relative w-64 h-64 md:w-80 md:h-80 archery-target rounded-full shadow-2xl cursor-crosshair group mt-2 mb-4" id="target-area">
<!-- Rings for visual definition -->
<div class="target-ring w-[20%] h-[20%]"></div>
<div class="target-ring w-[40%] h-[40%] border-white/30"></div>
<div class="target-ring w-[60%] h-[60%] border-white/30"></div>
<div class="target-ring w-[80%] h-[80%] border-white/30"></div>
<!-- Crosshairs on hover -->
<div class="absolute inset-0 opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none flex items-center justify-center">
<div class="w-full h-px bg-white/20"></div>
<div class="absolute h-full w-px bg-white/20"></div>
</div>
<!-- Predicted Shot (Cyan Circle) -->
<div class="absolute top-[40%] left-[55%] w-4 h-4 rounded-full border-2 border-primary-fixed-dim bg-primary-fixed-dim/20 shadow-[0_0_8px_rgba(0,218,243,0.5)] transform -translate-x-1/2 -translate-y-1/2 pointer-events-none"></div>
<!-- Actual Shot (Solid Yellow Pin - initially hidden, shown via JS) -->
<div class="hidden absolute w-3 h-3 rounded-full bg-yellow-400 shadow-md border border-black/50 transform -translate-x-1/2 -translate-y-1/2 pointer-events-none z-20" id="actual-shot">
<div class="absolute inset-0 bg-yellow-200 rounded-full animate-ping opacity-75"></div>
</div>
</div>
<!-- Legend -->
<div class="flex gap-stack-md mt-stack-md z-10 w-full justify-center">
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full border border-primary-fixed-dim bg-primary-fixed-dim/20"></div>
<span class="font-data-mono text-data-mono text-on-surface-variant text-xs">Predicted</span>
</div>
<div class="flex items-center gap-2">
<div class="w-3 h-3 rounded-full bg-yellow-400"></div>
<span class="font-data-mono text-data-mono text-on-surface-variant text-xs">Actual</span>
</div>
</div>
</section>
<!-- Manual Controls Section -->
<section class="w-full grid grid-cols-1 md:grid-cols-2 gap-stack-md">
<!-- Score Selector -->
<div class="bg-surface-container rounded-xl border border-white/10 p-stack-md flex flex-col gap-stack-md">
<h3 class="font-label-caps text-label-caps text-on-surface-variant">Manual Score Entry</h3>
<div class="grid grid-cols-4 gap-2">
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">X</button>
<button class="h-12 rounded border border-primary-fixed bg-primary-fixed/10 text-primary-fixed font-data-mono text-data-mono flex items-center justify-center">10</button>
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">9</button>
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">8</button>
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">7</button>
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">6</button>
<button class="h-12 rounded border border-white/10 bg-surface-variant hover:border-primary-fixed/30 hover:bg-surface-bright transition-colors font-data-mono text-data-mono text-on-surface flex items-center justify-center">M</button>
</div>
</div>
<!-- Notes Field -->
<div class="bg-surface-container rounded-xl border border-white/10 p-stack-md flex flex-col gap-stack-sm">
<h3 class="font-label-caps text-label-caps text-on-surface-variant">Notes</h3>
<textarea class="w-full bg-surface-container-low border border-white/10 rounded-lg p-3 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant/50 focus:border-primary-fixed focus:ring-1 focus:ring-primary-fixed resize-none h-full min-h-[100px]" placeholder="Add context (e.g., wind gust, release timing...)"></textarea>
</div>
</section>
</main>
<!-- Bottom Action Bar (Contextual FAB / Primary Action) -->
<div class="fixed bottom-0 w-full bg-surface-dim/90 backdrop-blur-xl border-t border-white/5 p-4 md:px-container-padding z-50 flex justify-center pb-safe">
<button class="w-full max-w-md h-14 bg-primary-fixed-dim hover:bg-primary-fixed transition-colors rounded-xl flex items-center justify-center gap-2 text-surface-dim font-headline-sm text-headline-sm-mobile">
<span class="material-symbols-outlined filled-icon">check_circle</span>
            Confirm Shot Result
        </button>
</div>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const targetArea = document.getElementById('target-area');
            const actualShot = document.getElementById('actual-shot');
            
            if(targetArea && actualShot) {
                targetArea.addEventListener('click', (e) => {
                    // Calculate click position relative to target
                    const rect = targetArea.getBoundingClientRect();
                    const x = ((e.clientX - rect.left) / rect.width) * 100;
                    const y = ((e.clientY - rect.top) / rect.height) * 100;
                    
                    // Move and show actual shot pin
                    actualShot.style.left = `${x}%`;
                    actualShot.style.top = `${y}%`;
                    actualShot.classList.remove('hidden');
                    
                    // Simple logic to select a score based on distance from center (rough approximation for demo)
                    const distFromCenter = Math.sqrt(Math.pow(x - 50, 2) + Math.pow(y - 50, 2));
                    console.log('Distance from center %:', distFromCenter);
                    
                    // Visual feedback
                    targetArea.style.transform = 'scale(0.98)';
                    setTimeout(() => {
                        targetArea.style.transform = 'scale(1)';
                    }, 100);
                });
            }
        });
    </script>
</body></html>
